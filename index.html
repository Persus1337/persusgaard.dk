<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Per Susgaard</title>
  <meta name="description" content="Per Susgaard – indhold kommer snart.">
  <style>
    :root { --bg: #fafaf8; --fg: #1a1a1a; --muted: #6b6b6b; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #141414; --fg: #f2f2f0; --muted: #9a9a9a; }
    }
    * { margin: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 16px;
    }
    h1 {
      font-weight: 300;
      font-size: clamp(2.25rem, 7vw, 4.5rem);
      letter-spacing: -0.02em;
    }
    p {
      margin-top: 1rem;
      color: var(--muted);
      font-size: 0.85rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <h1>Per Susgaard</h1>
  <p>Indhold kommer snart</p>
</body>
</html>
